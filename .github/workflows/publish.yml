name: Publish

# Publishes to npm when a GitHub Release is published.
#
# Setup (one time):
#   1. Create a granular access token at https://www.npmjs.com →
#      Access Tokens → Generate New Token → Granular:
#      - Allowed packages: async-context-kit (read + write)
#      - No expiration is convenient for CI; prefer a short expiry
#        with a rotation reminder if your org requires it.
#   2. Add it as a repository secret named NPM_TOKEN
#      (Settings → Secrets and variables → Actions).
#
# Releasing:
#   1. Bump the version: npm version patch|minor|major
#   2. Push the commit and tag: git push --follow-tags
#   3. Create a GitHub Release from the tag → publishing runs automatically.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - run: npm ci

      - name: Verify release tag matches package.json
        if: github.event_name == 'release'
        run: |
          TAG="${{ github.event.release.tag_name }}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${TAG#v}"
          echo "Release tag: $TAG (version $TAG_VERSION)"
          echo "package.json version: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Release tag ($TAG) does not match package.json version ($PKG_VERSION)."
            exit 1
          fi

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:build
      - run: npm pack --dry-run

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
